; ---------------------------------------------------------------------------
; تنظیمات ربات حسابداری حجم ادمین‌ها — PasarGuard
; این فایل را کنار bot.py با نام config.ini ذخیره کنید:
;     cp config.example.ini config.ini
; ---------------------------------------------------------------------------

[bot]

; --- تلگرام ----------------------------------------------------------------
; توکنی که BotFather می‌دهد
bot_token = 1234567890:AAExampleTokenReplaceMe

; آیدی چت‌هایی که اجازه‌ی استفاده دارند (با کاما جدا کنید).
; برای گرفتن آیدی خودتان: /start را به بات بفرستید و در لاگ بات ببینید،
; یا از @userinfobot استفاده کنید.
; خالی بگذارید = هر کسی که بات را پیدا کند می‌تواند استفاده کند (توصیه نمی‌شود)
allowed_chat_ids = -1001234567890, 123456789

; --- دیتابیس پنل -----------------------------------------------------------
; اگر خالی بماند، بات خودش از فایل .env پنل می‌خواند (توصیه می‌شود).
; مثال‌ها:
;   postgresql+psycopg2://pasarguard:PASS@127.0.0.1:5432/pasarguard
;   mysql+pymysql://pasarguard:PASS@127.0.0.1:3306/pasarguard
;   sqlite:////var/lib/pasarguard/db.sqlite3
; (درایورهای async پنل مثل asyncpg/asyncmy خودکار به نسخه‌ی sync تبدیل می‌شوند)
panel_db_url =

; مسیر فایل .env پنل — برای خواندن خودکار آدرس دیتابیس
panel_env_file = /opt/pasarguard/.env

; --- دفترکل بات ------------------------------------------------------------
; دیتابیس مستقل خودِ بات. به پنل دست نمی‌زند.
ledger_path = /opt/pg-accountant/ledger.db

; --- زمان‌بندی -------------------------------------------------------------
timezone = Asia/Tehran
; ساعت ارسال گزارش روزانه (۲۴ ساعته)
report_time = 00:00
; گزارشِ «روز گذشته» ارسال شود (true) یا «روز در حال جریان» (false)
report_previous_day = true
; فاصله‌ی اسکن دیتابیس به ثانیه.
; هرچه کمتر، احتمال از دست رفتن اکانتِ «ساخته و سریع حذف‌شده» کمتر.
scan_interval = 60

; --- قوانین حسابداری -------------------------------------------------------
; افت مصرف کمتر از این مقدار (بایت) ریست حساب نمی‌شود.
; پیش‌فرض ۱ مگابایت = 1048576
reset_drop_tolerance = 1048576

; اگر ادمین حجم اکانت موجود را زیاد کند، مابه‌التفاوت بیل شود
count_topup = true

; در اولین اجرا، اکانت‌های موجود در پنل هم ثبت شوند (backfill)
backfill_on_first_run = true
; فقط اکانت‌هایی که در این چند روز اخیر ساخته شده‌اند backfill شوند
backfill_days = 30

; --- ظاهر گزارش ------------------------------------------------------------
report_show_user_list = true
max_users_in_report = 60
persian_digits = true

; برای هر ادمین یک پیام جداگانه فرستاده شود (پیشنهاد می‌شود).
; با false ادمین‌ها تا سقف اندازه در پیام‌های کمتر جمع می‌شوند.
report_per_admin = true

; حداکثر تعداد ادمینی که پیام جزئیات می‌گیرد. بقیه فقط در پیام خلاصه
; (یک خط به‌ازای هر ادمین) می‌آیند. صفر = بدون سقف.
; اگر ۱۰۰ ادمین داری، ۱۰۱ پیام پشت‌سرهم زیاد است؛ ۵۰ منطقی‌تر است.
max_admin_messages = 50

; فاصله‌ی بین پیام‌ها به ثانیه. تلگرام در هر گروه حدود ۲۰ پیام در دقیقه
; اجازه می‌دهد؛ بدون این فاصله گزارش‌های طولانی 429 می‌گیرند.
message_delay = 1.2

; اگر بات بیش از این مدت خاموش بوده باشد، هشدار ثبت می‌شود
heartbeat_gap_warn_seconds = 300
