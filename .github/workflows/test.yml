name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-e2e:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile check
        run: python -m py_compile bot.py

      - name: Unit tests (script runner)
        run: python tests/test_accounting.py

      - name: Unit tests (pytest)
        run: python -m pytest tests/test_accounting.py -v --tb=short

      - name: End-to-end tests
        run: bash tests/e2e.sh

      - name: Installer syntax check
        run: bash -n install.sh

  drivers:
    name: DB driver availability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify every supported driver installs and imports
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install psycopg2-binary "pymysql[cryptography]"
          python - <<'PY'
          import importlib
          from sqlalchemy import create_engine
          for mod in ("requests", "sqlalchemy", "psycopg2", "pymysql"):
              importlib.import_module(mod)
              print(f"import {mod}: OK")
          for url in ("postgresql+psycopg2://u:p@h/db",
                      "mysql+pymysql://u:p@h/db",
                      "sqlite:////tmp/x.db"):
              eng = create_engine(url)
              print(f"{url.split('://')[0]:26} -> {eng.dialect.name}/{eng.dialect.driver}")
              eng.dispose()
          print("همه‌ی درایورها سالم‌اند")
          PY
